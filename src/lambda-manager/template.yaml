AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda-Manager
Metadata:
  AWS::ServerlessRepo::Application:
    Name: Coralogix-Lambda-Manager
    Description: Lambda-Manager provides automatic log group subscription for lambda functions.
    Author: Coralogix
    SpdxLicenseId: Apache-2.0
    LicenseUrl: LICENSE
    ReadmeUrl: README.md
    Labels:
      - coralogix
      - logs
      - loggroup
      - cloudwatch
      - lambda
    HomePageUrl: https://coralogix.com
    SemanticVersion: 3.0.0
    SourceCodeUrl: https://github.com/coralogix/coralogix-aws-serverless
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Integration configuration
        Parameters:
          - LogsFilter
          - RegexPattern
          - NotificationEmail
          - SnsKmsKeyArn
          - DestinationArn
          - DestinationRole
          - DestinationType
          - AdoptLegacyFilters
          - AddPermissionsToAllLogGroups
          - LogGroupPermissionPrefix
      - Label:
          default: Lambda configuration
        Parameters:
          - FunctionMemorySize
          - FunctionTimeout
Parameters:
  LogsFilter:
    Type: String
    Description: Log group filter
    Default: ''
  DestinationArn:
    Type: String
    Description: Coralogix Firehose stream / Lambda  ARN
  DestinationRole:
    Type: String
    Description: IAM role ARN that CloudWatch Logs assumes when delivering to Firehose. Leave empty for Lambda destinations.
    Default: ''
  DestinationType:
    Type: String
    Description: Destination type used for CloudFormation IAM permissions. Must match the service in DestinationArn.
    AllowedValues:
      - firehose
      - lambda
  DisableAddPermission:
    Type: String
    Description: When true, Lambda Manager does not modify the destination Lambda resource policy. Use this when CloudWatch Logs invoke permissions are managed separately. Only applies to Lambda destinations.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  AdoptLegacyFilters:
    Type: String
    Description: Explicitly migrate matching legacy Coralogix UUID filters. Keep false except during a controlled migration with unchanged settings.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  AddPermissionsToAllLogGroups:
    Type: String
    Description: When true, add one broad destination Lambda permission for CloudWatch Logs from any log group in this account and region instead of one permission per matching group. Only applies to Lambda destinations and is ignored when DisableAddPermission is true.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  RegexPattern:
    Type: String
    Description: Comma-separated list of Loggroup name regex pattern
    Default: /aws/lambda/.*
  LogGroupPermissionPrefix:
    Type: String
    Description: Comma-separated log group prefixes used to reduce destination Lambda policy entries. Matching groups share one permission per prefix; groups outside the prefixes receive individual permissions. Only applies to Lambda destinations and is ignored when DisableAddPermission or AddPermissionsToAllLogGroups is true.
    Default: ""
  AWSApiRequestsLimit:
    Type: Number
    Description: In case you got an error in the lambda which is related to ThrottlingException, then you can increase the limit of the requests that the lambda can do to the AWS API.
    Default: 10
  FunctionMemorySize:
    Type: Number
    Description: Lambda function memory limit
    MinValue: 128
    MaxValue: 3008
    Default: 1024
  FunctionTimeout:
    Type: Number
    Description: Lambda function timeout limit
    MinValue: 30
    MaxValue: 900
    Default: 900
  NotificationEmail:
    Type: String
    Description: Failure notification email address
    MaxLength: 320
    Default: ''
  SnsKmsKeyArn:
    Type: String
    Description: Optional KMS key ARN (not an alias) to encrypt the Lambda failure-notification SNS topic. Leave empty for no encryption. The key policy must allow sns.amazonaws.com and the Lambda execution role to use kms:Decrypt and kms:GenerateDataKey*.
    AllowedPattern: '^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
    Default: ''
Conditions:
  IsDestinationLambda:
    Fn::Equals:
      - Ref: DestinationType
      - lambda
  IsDestinationFirehose:
    Fn::Equals:
      - Ref: DestinationType
      - firehose
  IsNotificationEnabled:
    Fn::Not:
      - Fn::Equals:
          - Ref: NotificationEmail
          - ''
  IsSnsKmsKeySet:
    Fn::Not:
      - Fn::Equals:
          - Ref: SnsKmsKeyArn
          - ''
Resources:
  LambdaFunctionEventInvokeConfigOnFailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !If
        - IsSnsKmsKeySet
        - !Ref SnsKmsKeyArn
        - !Ref AWS::NoValue
  LambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-LambdaFunction'
      Description: Adds Coralogix firehose to Loggroups
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.14
      ReservedConcurrentExecutions: 1
      MemorySize:
        Ref: FunctionMemorySize
      Timeout:
        Ref: FunctionTimeout
      Environment:
        Variables:
          DISABLE_ADD_PERMISSION:
            Ref: DisableAddPermission
          LOGS_FILTER:
            Ref: LogsFilter
          REGEX_PATTERN:
            Ref: RegexPattern
          DESTINATION_ARN:
            Ref: DestinationArn
          DESTINATION_ROLE:
            Ref: DestinationRole
          ADOPT_LEGACY_FILTERS:
            Ref: AdoptLegacyFilters
          ADD_PERMISSIONS_TO_ALL_LOG_GROUPS:
            Ref: AddPermissionsToAllLogGroups
          LOG_GROUP_PERMISSION_PREFIX:
            Ref: LogGroupPermissionPrefix
          AWS_API_REQUESTS_LIMIT:
            Ref: AWSApiRequestsLimit
      Policies:
        - Statement:
            - !If
              - IsDestinationLambda
              - Sid: CXAddDestinationPermission
                Effect: Allow
                Action:
                  - lambda:AddPermission
                Resource:
                  - !Ref DestinationArn
              - !Ref AWS::NoValue
            - Sid: CWSubscriptionPolicy
              Effect: Allow
              Action:
                - logs:PutSubscriptionFilter
                - logs:DeleteSubscriptionFilter
                - logs:DescribeLogGroups
                - logs:DescribeSubscriptionFilters
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:*:*:*"
            - Sid: CWLogGroupTagPolicy
              Effect: Allow
              Action:
                - logs:TagResource
                - logs:UntagResource
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
            - Sid: GetManagedLogGroupsByTag
              Effect: Allow
              Action:
                - tag:GetResources
              Resource: "*"
            - !If
              - IsDestinationFirehose
              - Sid: CXPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
              - !Ref AWS::NoValue
            - !If
              - IsSnsKmsKeySet
              - Sid: SnsKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !Ref SnsKmsKeyArn
              - !Ref AWS::NoValue
      EventInvokeConfig:
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref LambdaFunctionEventInvokeConfigOnFailureTopic
      Events:
        EventBridgeRule:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - "aws.logs"
              detail-type:
                - "AWS API Call via CloudTrail"
              detail:
                eventSource:
                  - "logs.amazonaws.com"
                eventName:
                  - "CreateLogGroup"
                requestParameters:
                  logGroupClass:
                    - "STANDARD"
                    - exists: false
            Target:
                Id: cx-loggroup-target

  LambdaTrigger:
    Type: Custom::LambdaTrigger
    Properties:
      ServiceToken: !GetAtt LambdaFunction.Arn
      RegexPattern: !Ref RegexPattern
      LogsFilter: !Ref LogsFilter
      DestinationArn: !Ref DestinationArn
      DestinationRole: !Ref DestinationRole
      DisableAddPermission: !Ref DisableAddPermission
      AddPermissionsToAllLogGroups: !Ref AddPermissionsToAllLogGroups
      LogGroupPermissionPrefix: !Ref LogGroupPermissionPrefix
      AdoptLegacyFilters: !Ref AdoptLegacyFilters
      ReconcilerVersion: 3.0.0

  LambdaFunctionNotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: IsNotificationEnabled
    Properties:
      Protocol: email
      Endpoint:
        Ref: NotificationEmail
      TopicArn:
        Ref: LambdaFunctionEventInvokeConfigOnFailureTopic

Outputs:
  LambdaManagerFunctionName:
    Description: Lambda Manager function name for synchronous reconciliation invocations
    Value: !Ref LambdaFunction
  LambdaManagerFunctionArn:
    Description: Lambda Manager function ARN for invocation permissions and reconciliation
    Value: !GetAtt LambdaFunction.Arn
