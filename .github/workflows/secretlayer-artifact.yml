name: Secret Layer Artifact

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/lambda-secretLayer/**'
      - 'scripts/secretlayer_zip_*.sh'
      - '.github/workflows/secretlayer-artifact.yml'
  push:
    branches: [master]
    paths:
      - 'src/lambda-secretLayer/**'
      - 'scripts/secretlayer_zip_*.sh'

jobs:
  check-wrapper-zip:
    name: Check wrapper.zip matches sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrapper.zip is a committed binary and is what the layer deploys, so a
      # source edit that is not re-zipped silently never ships. This caught the
      # console.log(secretName) removal from #190, which sat undelivered for a year.
      - name: Check wrapper.zip is not stale
        run: bash scripts/secretlayer_zip_check.sh
