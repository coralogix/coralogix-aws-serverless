name: Salesforce Event Log Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/sf-eventlog/**'
      - '.github/workflows/sf-eventlog-tests.yml'
  push:
    branches: [master]
    paths:
      - 'src/sf-eventlog/**'
      - '.github/workflows/sf-eventlog-tests.yml'

jobs:
  ingestion-contract:
    name: Check Coralogix ingestion contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/sf-eventlog/requirements.txt
      - name: Install dependencies
        working-directory: src/sf-eventlog
        run: python -m pip install -r requirements.txt
      - name: Test singles payload and authorization
        working-directory: src/sf-eventlog
        run: python -m unittest -v test_ingestion.py
