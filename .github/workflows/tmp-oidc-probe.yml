name: OIDC fork probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and print decoded claims
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "NO_ACTIONS_ID_TOKEN_REQUEST_TOKEN: id-token env vars absent"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > /tmp/resp.json
          if ! jq -e '.value' /tmp/resp.json >/dev/null; then
            echo "TOKEN_REQUEST_FAILED:"
            cat /tmp/resp.json
            exit 0
          fi
          python3 -c "
          import base64, json
          t = json.load(open('/tmp/resp.json'))['value']
          p = t.split('.')[1]; p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ('sub','aud','iss','repository','event_name','ref'):
              print(k, '=', c.get(k))
          "
          echo "OIDC_TOKEN_ISSUED: yes"
